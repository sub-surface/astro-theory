[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "celestrium"
version = "0.2.0"
description = "A three-wing astrophysics instrument: theory workshop, experimental validation bench, and imaging studio."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "python-dotenv>=1.0",
    "astropy>=6.0",
    "astropy-healpix>=1.0",
    "astroquery>=0.4.10",
    "pyvo>=1.5",
    "matplotlib>=3.7",
    "requests>=2.28",
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
celestrium = "celestrium.hub:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["celestrium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

