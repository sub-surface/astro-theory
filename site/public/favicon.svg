<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- OLED Dark Background with soft rounded squircle -->
  <rect width="64" height="64" rx="14" fill="#050505" />
  
  <!-- Subtle reticle border -->
  <circle cx="32" cy="32" r="29" stroke="#1c1c1c" stroke-width="0.8" stroke-dasharray="2 3" />

  <!-- Celestial cyan orbital rings -->
  <g filter="url(#glow-cyan)">
    <ellipse cx="43" cy="21" rx="13" ry="5.5" transform="rotate(-30 43 21)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.9" fill="none" />
    <ellipse cx="43" cy="21" rx="13" ry="5.5" transform="rotate(35 43 21)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.9" fill="none" />
    <!-- 4-point Pulsar Star -->
    <path d="M43 14 Q43 21 36 21 Q43 21 43 28 Q43 21 50 21 Q43 21 43 14 Z" fill="#38bdf8" />
    <circle cx="43" cy="21" r="2" fill="#ffffff" />
  </g>

  <!-- Cute telescope in warm amber -->
  <g filter="url(#glow-amber)">
    <!-- Main telescope barrel -->
    <rect x="23" y="27" width="13" height="7" rx="1" transform="rotate(-40 29.5 30.5)" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2" />
    <!-- Objective lens rim -->
    <line x1="33" y1="21.5" x2="38.5" y2="28" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <!-- Eyepiece section -->
    <rect x="18" y="33" width="7" height="4" rx="0.5" transform="rotate(-40 21.5 35)" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Mount knob -->
    <circle cx="27" cy="36" r="2.5" fill="#f59e0b" />
    <!-- Tripod legs -->
    <line x1="27" y1="38" x2="18" y2="54" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" />
    <line x1="27" y1="38" x2="27" y2="55" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" />
    <line x1="27" y1="38" x2="36" y2="54" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>
